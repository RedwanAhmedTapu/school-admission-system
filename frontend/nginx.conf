server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # config.js is regenerated at start: never cache it
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths (/applications, /admin/...) fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
